# Publishes onejs-svelte to npm through trusted publishing (OIDC): no npm token
# exists anywhere. GitHub mints a short-lived token for this workflow, npm checks
# it against the trusted publisher in the package settings, and provenance is
# attached by itself.
#
# The filename matters: npm matches "publish.yml" literally against the trusted
# publisher entry, so renaming this file breaks publishing until the entry on
# npmjs.com is recreated.
#
# 0.1.0 was published by hand, since npm attaches a trusted publisher only to a
# package that already exists. Its tag runs the gates and publishes nothing.
name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: onejs-svelte

    steps:
      # Checked out into a named folder so the siblings below sit beside it:
      # onejs-svelte links them through "file:../" dev dependencies, the layout these
      # packages are developed in inside the OneJS container.
      - uses: actions/checkout@v4
        with:
          path: onejs-svelte

      - uses: actions/checkout@v4
        with:
          repository: Singtaa/onejs-elements
          ref: main
          path: onejs-elements

      - uses: actions/checkout@v4
        with:
          repository: Singtaa/unity-types
          ref: main
          path: unity-types

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14.0 and an npm that speaks OIDC
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm supports trusted publishing
        run: npm install -g "npm@>=11.15.0"

      - name: Check the tag matches package.json
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag $GITHUB_REF_NAME is version $tag_version, package.json is $pkg_version." >&2
            exit 1
          fi
          echo "Publishing $pkg_version"

      - name: Check the version is not already published
        id: registry
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          if npm view "onejs-svelte@$pkg_version" version >/dev/null 2>&1; then
            echo "onejs-svelte@$pkg_version is already on npm; running the gates and publishing nothing."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      - run: npm publish
        if: steps.registry.outputs.published != 'true'
