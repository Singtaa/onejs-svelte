name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is a gate: developers here work on it.
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        working-directory: onejs-svelte

    steps:
      # Checked out into a named folder so the siblings below sit beside it:
      # onejs-svelte links them through "file:../" dev dependencies, the layout these
      # packages are developed in inside the OneJS container.
      - uses: actions/checkout@v4
        with:
          path: onejs-svelte

      - uses: actions/checkout@v4
        with:
          repository: Singtaa/onejs-elements
          ref: main
          path: onejs-elements

      - uses: actions/checkout@v4
        with:
          repository: Singtaa/unity-types
          ref: main
          path: unity-types

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: onejs-svelte/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test
