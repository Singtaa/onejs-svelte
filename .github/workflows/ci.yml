name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # publish.yml runs this as its gate: nothing publishes unless every OS passes
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is a gate: developers here work on it. macOS is one too:
        # the editor runs there as well.
        os: [ubuntu-latest, windows-latest, macos-latest]

    defaults:
      run:
        working-directory: onejs-svelte

    steps:
      # Checked out into a named folder so the siblings below sit beside it:
      # onejs-svelte links them through "file:../" dev dependencies, the layout these
      # packages are developed in inside the OneJS container.
      - uses: actions/checkout@v4
        with:
          path: onejs-svelte

      - uses: actions/checkout@v4
        with:
          repository: Singtaa/onejs-elements
          ref: main
          path: onejs-elements

      - uses: actions/checkout@v4
        with:
          repository: Singtaa/unity-types
          ref: main
          path: unity-types

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            onejs-svelte/package-lock.json
            onejs-elements/package-lock.json

      # A file: link is a symlink, and TypeScript and Vite resolve the linked
      # package's own imports (vitest, unity-types) from its real folder: the
      # sibling needs its dependencies installed, as it has them in the container.
      # Installed from npm it is a real copy, and resolves them from the app.
      - run: npm ci
        working-directory: onejs-elements

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test
